; excel2mysql-cli 默认连接配置
; ---------------------------------------------------------------------------
; 这份文件随包放在 excel2mysql-cli.exe 旁边，命令行不带 -c 时会自动读它。
; 也可以显式指定：excel2mysql-cli.exe -c conn.ini 数据目录
; 优先级：命令行参数 > 环境变量 E2M_HOST/E2M_PORT/E2M_USER/E2M_PASS/E2M_DB > 本文件
;
; 密码建议留空，改用环境变量传，免得这份文件被拷来拷去带着口令：
;     set E2M_PASS=你的密码
; 真要写在这里也行，但这份文件不要外发、不要提交到仓库（.gitignore 已排除 /conn.ini）。
; database 留空是有意为之：没指定目标库时命令行会直接报用法错误，不会跑半截。
; ---------------------------------------------------------------------------
[mysql]
host = 127.0.0.1
port = 3306
user = root
password =
database =
