# log4j-api 在只带 api、不带实现（core）时会往 stderr 打一行
# "ERROR Log4j API could not find a logging provider"。POI 走的就是这条：
# 它只用 log4j-api 记内部日志，我们不打日志框架，也不该在操作员的日志里
# 冒出一行没人认领的 ERROR——现场会当成导入失败去查库。
# 这里选 log4j-api 自带的 Simple 实现（不额外拉一个几 MB 的 log4j-core），
# 并把它的状态日志关到 OFF。文件名与键名是 log4j-api 规定的，不能改。
log4j2.loggerContextFactory = org.apache.logging.log4j.simple.SimpleLoggerContextFactory
org.apache.logging.log4j.simplelog.StatusLogger.level = OFF
org.apache.logging.log4j.simplelog.log4j.level = OFF
