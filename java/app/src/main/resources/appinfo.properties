# Stamped at build time. Do not edit values by hand:
# version comes from the pom (single source), commit/commitFull/branch/dirty are passed
# in by the build command with -Dgit.commit -Dgit.commitFull -Dgit.branch -Dgit.dirty.
# Left blank means "unknown" -- AppInfo never invents a commit id.
version=${project.version}
builtAt=${timestamp}
commit=${git.commit}
commitFull=${git.commitFull}
branch=${git.branch}
dirty=${git.dirty}
