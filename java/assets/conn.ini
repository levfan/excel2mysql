; excel2mysql（Java 线）命令行默认连接配置
; ---------------------------------------------------------------------------
; 这份文件随包放在 excel2mysql-<版本>.jar 旁边，命令行不带 -c 时会自动读它。
; 也可以显式指定：java -jar excel2mysql-1.0.4.jar -c conn.ini C:\数据
; 优先级：命令行参数 > 环境变量 E2M_HOST/E2M_PORT/E2M_USER/E2M_PASS/E2M_DB > 本文件
;
; 密码建议留空，改用环境变量传，免得这份文件被拷来拷去带着口令：
;     set E2M_PASS=你的密码
; 真要写在这里也行，但这份文件不要外发、不要提交到仓库。
; database 留空是有意为之：没指定目标库时命令行会直接报用法错误，不会跑半截。
; ---------------------------------------------------------------------------
[mysql]
host = 127.0.0.1
port = 3306
user = root
password =
database =
